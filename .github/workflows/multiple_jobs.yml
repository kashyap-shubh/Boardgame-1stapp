name: 2nd Version - Java CI with Maven with multiple jobs

on:
  workflow_dispatch:

jobs:

  checkout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload Source Code
        uses: actions/upload-artifact@v4
        with:
          name: prog-code
          path: .

  java_install:
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - name: Download Source Code
        uses: actions/download-artifact@v4
        with:
          name: prog-code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

  build:
    runs-on: ubuntu-latest
    needs: java_install

    steps:
      - name: Download Source Code
        uses: actions/download-artifact@v4
        with:
          name: prog-code

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: target/*.jar

  list:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: artifact

      - name: Display Downloaded Files
        run: ls -R
