name: Java CI with Maven

on:
  push:
    branches: [ "main" ]


jobs:
  build:

    name: Shubham
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

  export:

    name: Ankit
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/upload-artifact@v7
      with:
        name: boardgame
        path: target/*.jar
