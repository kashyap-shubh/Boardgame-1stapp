name: Java CI with Maven with mutiple jobs

on:
  workflow_dispatch:

jobs:

  runs-on: ubuntu-latest
  checkout:


    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

  java_install:
    needs: checkout

    steps:

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

  build:
    needs: java_install

    steps:
      - name: Build with Maven
        run: mvn -B package --file pom.xml

  upload:
    needs: build

    steps:
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-jar
          path: target/*.jar
