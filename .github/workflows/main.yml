name: Java CI with Maven

on:
  workflow_dispatch:

jobs:
  checkout:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

  java_install:

    runs-on: ubuntu-latest
    needs: checkout

    steps:

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

  build:

    runs-on: ubuntu-latest
    needs: java_install

    steps:
      - name: Build with Maven
        run: mvn -B package --file pom.xml

  upload:

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-jar
          path: target/*.jar
